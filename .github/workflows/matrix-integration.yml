name: Live Matrix integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-matrix:
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AIMTRIX_LIVE_OWNER: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.replica }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test diagnostic privacy
        run: npm run test:matrix:privacy
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build the static client
        run: npm run build
      - name: Independent clean Matrix run
        run: npm run test:matrix
      - name: Deliberately fail and verify private diagnostics
        if: matrix.replica == 1
        run: npm run test:matrix -- --probe-failure
      - name: Remove any remaining job-owned test services
        if: always()
        run: node tests/live-matrix/cleanup.mjs
      - name: Preserve only allowlisted Matrix summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-summary-${{ matrix.replica }}-${{ github.run_id }}
          path: |
            matrix-test-results/run-1.json
            matrix-test-results/failure-probe-1.json
          if-no-files-found: ignore
          retention-days: 14
  element-web-peer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AIMTRIX_LIVE_OWNER: ci-element-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build the static client
        run: npm run build
      - name: Exercise encrypted Element Web peer
        run: npm run test:matrix -- --element-ui
      - name: Remove any remaining job-owned test services
        if: always()
        run: node tests/live-matrix/cleanup.mjs
      - name: Preserve only allowlisted Matrix summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-element-summary-${{ github.run_id }}
          path: matrix-test-results/run-1.json
          if-no-files-found: ignore
          retention-days: 14
  matrixrtc-live-peer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AIMTRIX_LIVE_OWNER: ci-rtc-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build the static client
        run: npm run build
      - name: Verify bounded SFU interruption cleanup
        run: node --test tests/live-matrix/rtc-interruption.test.mjs
      - name: Exercise two encrypted MatrixRTC peers over disposable LiveKit
        run: node tests/live-matrix/group-rtc.mjs
      - name: Remove any remaining job-owned test services
        if: always()
        run: node tests/live-matrix/cleanup.mjs
      - name: Preserve allowlisted MatrixRTC summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-rtc-summary-${{ github.run_id }}
          path: matrix-test-results/group-rtc.json
          if-no-files-found: ignore
          retention-days: 14
  cache-enabled-reload-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AIMTRIX_LIVE_OWNER: ci-cache-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build the static client
        run: npm run build
      - name: Measure same-device reload with Synapse sync cache enabled
        run: npm run test:matrix -- --profile-cache-reload
      - name: Remove any remaining job-owned test services
        if: always()
        run: node tests/live-matrix/cleanup.mjs
      - name: Preserve only allowlisted Matrix summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-cache-reload-summary-${{ github.run_id }}
          path: matrix-test-results/cache-reload-1.json
          if-no-files-found: ignore
          retention-days: 14
  synthetic-large-account:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build the static client
        run: npm run build
      - name: Measure synthetic 10k-room rendering
        run: |
          mkdir -p matrix-test-results
          node scripts/profile-large-account.mjs --rooms=10000 --cycles=100 > matrix-test-results/synthetic-large-account.json
      - name: Preserve synthetic performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-synthetic-large-account-${{ github.run_id }}
          path: matrix-test-results/synthetic-large-account.json
          if-no-files-found: ignore
          retention-days: 14
  delegated-auth-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AIMTRIX_LIVE_OWNER: ci-auth-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build the static client
        run: npm run build
      - name: Exercise delegated Matrix sign-in and revocation against disposable MAS
        run: npm run test:matrix -- --delegated-auth
      - name: Remove any remaining job-owned test services
        if: always()
        run: node tests/live-matrix/cleanup.mjs
      - name: Preserve only allowlisted Matrix summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-delegated-auth-summary-${{ github.run_id }}
          path: matrix-test-results/delegated-auth-1.json
          if-no-files-found: ignore
          retention-days: 14
