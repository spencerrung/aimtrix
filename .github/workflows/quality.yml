name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, test, and build
        run: npm run check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser and accessibility tests
        run: PLAYWRIGHT_PREVIEW=1 npm run test:e2e

      - name: Push privacy proofs
        run: npm run proof:push && npm run proof:push-sw

  mobile-shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and synchronize Capacitor projects
        run: npm run mobile:sync

      - name: Verify native release inputs
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          test -f ios/App/App/Info.plist
          test -f ios/App/App/PrivacyInfo.xcprivacy
          grep -q 'applicationId "dev.alucard.aimtrix"' android/app/build.gradle
          grep -q 'custom_url_scheme.*aimtrix' android/app/src/main/res/values/strings.xml
