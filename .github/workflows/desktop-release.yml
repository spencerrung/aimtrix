name: Desktop release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.1.0)
        required: true
        type: string
      prerelease:
        description: Mark the draft GitHub release as a prerelease
        required: false
        default: false
        type: boolean
      target:
        description: Platform matrix to build; push-tag runs can use DESKTOP_RELEASE_TARGET temporarily
        required: false
        default: all
        type: choice
        options:
          - all
          - linux
          - macos
          - windows

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_TARGET: ${{ inputs.target || vars.DESKTOP_RELEASE_TARGET || 'all' }}
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
  APPLE_ID: ${{ secrets.APPLE_ID }}
  APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

jobs:
  select:
    name: Select release target
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build target matrix
        id: matrix
        shell: bash
        env:
          target: ${{ inputs.target || vars.DESKTOP_RELEASE_TARGET || 'all' }}
        run: |
          set -euo pipefail
          case "$target" in
            all)
              matrix='{"include":[{"name":"Linux x86_64","os":"ubuntu-22.04","bundles":"appimage,deb,rpm","target":"linux"},{"name":"macOS Apple Silicon","os":"macos-15-arm64","bundles":"dmg,app","target":"macos"},{"name":"macOS Intel","os":"macos-15","bundles":"dmg,app","target":"macos"},{"name":"Windows x86_64","os":"windows-2022","bundles":"nsis,msi","target":"windows"}]}'
              ;;
            linux)
              matrix='{"include":[{"name":"Linux x86_64","os":"ubuntu-22.04","bundles":"appimage,deb,rpm","target":"linux"}]}'
              ;;
            macos)
              matrix='{"include":[{"name":"macOS Apple Silicon","os":"macos-15-arm64","bundles":"dmg,app","target":"macos"},{"name":"macOS Intel","os":"macos-15","bundles":"dmg,app","target":"macos"}]}'
              ;;
            windows)
              matrix='{"include":[{"name":"Windows x86_64","os":"windows-2022","bundles":"nsis,msi","target":"windows"}]}'
              ;;
            *)
              echo "RELEASE_TARGET must be all, linux, macos, or windows; received $target" >&2
              exit 1
              ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: select
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TARGET" =~ ^(all|linux|macos|windows)$ ]] || {
            echo "RELEASE_TARGET must be all, linux, macos, or windows; received $RELEASE_TARGET" >&2
            exit 1
          }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
            echo "RELEASE_TAG must use vMAJOR.MINOR.PATCH, received $RELEASE_TAG" >&2
            exit 1
          }
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo 'Missing TAURI_SIGNING_PRIVATE_KEY repository secret.' >&2
            exit 1
          }
          test -n "$TAURI_UPDATER_PUBLIC_KEY" || {
            echo 'Missing TAURI_UPDATER_PUBLIC_KEY repository variable.' >&2
            exit 1
          }

      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE" || { echo 'Missing APPLE_CERTIFICATE.' >&2; exit 1; }
          test -n "$APPLE_CERTIFICATE_PASSWORD" || { echo 'Missing APPLE_CERTIFICATE_PASSWORD.' >&2; exit 1; }
          test -n "$KEYCHAIN_PASSWORD" || { echo 'Missing KEYCHAIN_PASSWORD.' >&2; exit 1; }
          certificate="$RUNNER_TEMP/aimtrix-developer-id.p12"
          keychain="$RUNNER_TEMP/aimtrix-build.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -t 3600 -u "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/{print $2; exit}')
          test -n "$identity" || { echo 'No Developer ID Application identity found.' >&2; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Import Windows signing certificate
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { throw 'Missing WINDOWS_CERTIFICATE.' }
          if (-not $env:WINDOWS_CERTIFICATE_PASSWORD) { throw 'Missing WINDOWS_CERTIFICATE_PASSWORD.' }
          $directory = Join-Path $env:RUNNER_TEMP 'aimtrix-certificate'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $encoded = Join-Path $directory 'certificate.txt'
          $certificate = Join-Path $directory 'certificate.pfx'
          Set-Content -Path $encoded -Value $env:WINDOWS_CERTIFICATE
          certutil -decode $encoded $certificate | Out-Host
          $imported = @(Import-PfxCertificate -FilePath $certificate -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force))
          if ($imported.Count -eq 0) { throw 'Windows certificate import failed.' }
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($imported[0].Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set release version and updater configuration
        shell: bash
        run: |
          npm version "${RELEASE_TAG#v}" --no-git-tag-version --ignore-scripts
          node scripts/prepare-tauri-release.mjs

      - name: Install dependencies
        run: npm ci

      - name: Validate release contract
        run: npm run release:validate

      - name: Build and publish signed desktop artifacts
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Aimtrix ${{ env.RELEASE_TAG }}
          releaseBody: See docs/desktop-release.md for installation, update, and rollback verification.
          releaseDraft: true
          prerelease: ${{ inputs.prerelease || false }}
          tauriScript: ./node_modules/.bin/tauri
          args: --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.generated.json

  audit:
    name: Audit release assets
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download draft release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-artifacts
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-artifacts

      - name: Checkout release validation tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: release-tools

      - name: Validate updater metadata
        run: node release-tools/scripts/validate-release-metadata.mjs "$(find release-artifacts -name latest.json -print -quit)"

      - name: Generate source SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: release-artifacts/aimtrix-${{ env.RELEASE_TAG }}-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate checksums
        run: |
          find release-artifacts -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > release-artifacts/SHA256SUMS

      - name: Attest downloaded release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-artifacts/**

      - name: Upload release audit assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" release-artifacts/SHA256SUMS release-artifacts/aimtrix-${RELEASE_TAG}-sbom.spdx.json --repo "$GITHUB_REPOSITORY" --clobber
